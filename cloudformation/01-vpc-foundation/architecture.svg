<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">VPC Network Foundation</text>
  <text x="500" y="63" text-anchor="middle" font-size="14" fill="#64748B">Multi-AZ public / private architecture · region us-east-2 · 10.0.0.0/16</text>

  <!-- Internet -->
  <rect x="440" y="90" width="120" height="46" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Internet</text>
  <line x1="500" y1="136" x2="500" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Internet Gateway -->
  <rect x="418" y="168" width="164" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="500" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">Internet Gateway</text>
  <line x1="500" y1="214" x2="500" y2="228" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="40" y="228" width="920" height="466" rx="14" fill="#F8FAFF" stroke="#4338CA" stroke-width="2.5"/>
  <text x="62" y="254" font-size="15" font-weight="700" fill="#4338CA">VPC · 10.0.0.0/16</text>

  <!-- ===================== AZ A ===================== -->
  <rect x="70" y="282" width="420" height="386" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="90" y="306" font-size="13" font-weight="600" fill="#475569">Availability Zone — us-east-2a</text>

  <!-- public subnet A -->
  <rect x="95" y="322" width="370" height="150" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="112" y="344" font-size="13" font-weight="700" fill="#15803D">Public subnet · 10.0.0.0/24</text>
  <text x="112" y="362" font-size="11" fill="#166534">route  0.0.0.0/0  →  Internet Gateway</text>
  <rect x="112" y="374" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="192" y="402" text-anchor="middle" font-size="12" fill="#334155">Load Balancer</text>
  <rect x="288" y="374" width="160" height="46" rx="6" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="368" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#0F766E">NAT Gateway</text>
  <text x="368" y="411" text-anchor="middle" font-size="9" fill="#0D9488">(optional · cost-gated)</text>

  <!-- private subnet A -->
  <rect x="95" y="492" width="370" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112" y="514" font-size="13" font-weight="700" fill="#1D4ED8">Private subnet · 10.0.10.0/24</text>
  <text x="112" y="532" font-size="11" fill="#1E40AF">route  0.0.0.0/0  →  NAT Gateway</text>
  <rect x="112" y="546" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="192" y="576" text-anchor="middle" font-size="12" fill="#334155">App servers</text>
  <rect x="288" y="546" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="368" y="576" text-anchor="middle" font-size="12" fill="#334155">Database</text>

  <!-- ===================== AZ B ===================== -->
  <rect x="510" y="282" width="420" height="386" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="530" y="306" font-size="13" font-weight="600" fill="#475569">Availability Zone — us-east-2b</text>

  <!-- public subnet B -->
  <rect x="535" y="322" width="370" height="150" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="552" y="344" font-size="13" font-weight="700" fill="#15803D">Public subnet · 10.0.1.0/24</text>
  <text x="552" y="362" font-size="11" fill="#166534">route  0.0.0.0/0  →  Internet Gateway</text>
  <rect x="552" y="374" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="632" y="402" text-anchor="middle" font-size="12" fill="#334155">Load Balancer</text>

  <!-- private subnet B -->
  <rect x="535" y="492" width="370" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="552" y="514" font-size="13" font-weight="700" fill="#1D4ED8">Private subnet · 10.0.11.0/24</text>
  <text x="552" y="532" font-size="11" fill="#1E40AF">route  0.0.0.0/0  →  NAT Gateway</text>
  <rect x="552" y="546" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="632" y="576" text-anchor="middle" font-size="12" fill="#334155">App servers</text>
  <rect x="728" y="546" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="808" y="576" text-anchor="middle" font-size="12" fill="#334155">Database</text>

  <!-- Legend -->
  <rect x="60" y="712" width="15" height="15" rx="3" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="82" y="724" font-size="12" fill="#475569">Public subnet (internet-facing)</text>
  <rect x="320" y="712" width="15" height="15" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="342" y="724" font-size="12" fill="#475569">Private subnet (isolated)</text>
  <rect x="540" y="712" width="15" height="15" rx="3" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="562" y="724" font-size="12" fill="#475569">NAT (optional)</text>
  <rect x="700" y="712" width="15" height="15" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="722" y="724" font-size="12" fill="#475569">Internet Gateway</text>
</svg>
