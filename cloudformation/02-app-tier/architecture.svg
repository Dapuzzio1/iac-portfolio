<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="730" fill="#FFFFFF"/>

  <text x="500" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Highly-Available Web Tier</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">ALB + EC2 Auto Scaling · sits on the Project 1 VPC · region us-east-2</text>

  <!-- Internet -->
  <rect x="440" y="80" width="120" height="44" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="500" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Internet</text>
  <line x1="500" y1="124" x2="500" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="512" y="146" font-size="11" fill="#475569">HTTP :80</text>

  <!-- VPC (imported) -->
  <rect x="40" y="156" width="920" height="540" rx="14" fill="#F8FAFF" stroke="#4338CA" stroke-width="2.5"/>
  <text x="62" y="182" font-size="14" font-weight="700" fill="#4338CA">VPC — imported from Project 1 (dev-vpc-id)</text>

  <!-- ALB -->
  <rect x="100" y="200" width="800" height="60" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.8"/>
  <text x="500" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">Application Load Balancer</text>
  <text x="500" y="245" text-anchor="middle" font-size="11" fill="#9A3412">public subnets · spans us-east-2a + us-east-2b</text>
  <!-- ALB SG pill -->
  <rect x="330" y="270" width="340" height="24" rx="12" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="500" y="286" text-anchor="middle" font-size="11" fill="#991B1B">ALB SG — inbound :80 from 0.0.0.0/0 (internet)</text>

  <!-- arrows ALB -> instances -->
  <line x1="290" y1="260" x2="290" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="710" y1="260" x2="710" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="500" y="320" text-anchor="middle" font-size="11" fill="#475569">forwards :80 to healthy targets</text>

  <!-- ASG dashed box -->
  <rect x="80" y="360" width="840" height="270" rx="10" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="100" y="382" font-size="12" font-weight="600" fill="#6D28D9">Auto Scaling Group — min 2 / max 4 · self-heals &amp; replaces unhealthy instances across AZs</text>

  <!-- AZ A subnet -->
  <rect x="110" y="398" width="370" height="150" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="128" y="420" font-size="12" font-weight="700" fill="#15803D">Public subnet · us-east-2a · 10.0.0.0/24</text>
  <rect x="150" y="432" width="290" height="96" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="295" y="472" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">EC2 web server</text>
  <text x="295" y="492" text-anchor="middle" font-size="11" fill="#1E40AF">Apache / httpd on :80</text>

  <!-- AZ B subnet -->
  <rect x="520" y="398" width="370" height="150" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="538" y="420" font-size="12" font-weight="700" fill="#15803D">Public subnet · us-east-2b · 10.0.1.0/24</text>
  <rect x="560" y="432" width="290" height="96" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="705" y="472" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">EC2 web server</text>
  <text x="705" y="492" text-anchor="middle" font-size="11" fill="#1E40AF">Apache / httpd on :80</text>

  <!-- Instance SG pill -->
  <rect x="315" y="566" width="370" height="24" rx="12" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="500" y="582" text-anchor="middle" font-size="11" fill="#991B1B">Instance SG — inbound :80 from the ALB SG only</text>

  <!-- import note -->
  <text x="500" y="662" text-anchor="middle" font-size="11.5" fill="#4338CA">Imported via !ImportValue:  dev-vpc-id · dev-public-subnets   (Project 1 exports)</text>

  <!-- legend -->
  <rect x="120" y="700" width="14" height="14" rx="3" fill="#FED7AA" stroke="#EA580C"/><text x="140" y="711" font-size="11" fill="#475569">Load balancer</text>
  <rect x="270" y="700" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB"/><text x="290" y="711" font-size="11" fill="#475569">EC2 instance</text>
  <rect x="410" y="700" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#16A34A"/><text x="430" y="711" font-size="11" fill="#475569">Public subnet</text>
  <rect x="560" y="700" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#EF4444"/><text x="580" y="711" font-size="11" fill="#475569">Security group rule</text>
</svg>
