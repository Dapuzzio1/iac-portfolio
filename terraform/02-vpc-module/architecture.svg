<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Reusable VPC Module — dev + prod</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#64748B">one module, called twice · remote state in S3</text>

  <!-- module box -->
  <rect x="350" y="80" width="200" height="72" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">module "vpc"</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#6D28D9">./modules/vpc (reusable)</text>

  <!-- arrows to two envs -->
  <line x1="410" y1="152" x2="250" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="152" x2="650" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="185" font-size="11" fill="#475569">environment=dev</text>
  <text x="560" y="185" font-size="11" fill="#475569">environment=prod</text>

  <!-- dev VPC -->
  <rect x="70" y="212" width="330" height="196" rx="11" fill="#F8FAFF" stroke="#4338CA" stroke-width="2"/>
  <text x="90" y="236" font-size="13" font-weight="700" fill="#4338CA">dev VPC  10.0.0.0/16</text>
  <rect x="90" y="248" width="140" height="66" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="160" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">2 public subnets</text>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#166534">10.0.0/24 · 10.0.1/24</text>
  <rect x="240" y="248" width="140" height="66" rx="6" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="310" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#4338CA">2 private subnets</text>
  <text x="310" y="294" text-anchor="middle" font-size="10" fill="#3730A3">10.0.10/24 · 10.0.11/24</text>
  <text x="235" y="344" text-anchor="middle" font-size="11" fill="#475569">IGW + public routing · 2 AZs</text>

  <!-- prod VPC -->
  <rect x="500" y="212" width="330" height="196" rx="11" fill="#F8FAFF" stroke="#4338CA" stroke-width="2"/>
  <text x="520" y="236" font-size="13" font-weight="700" fill="#4338CA">prod VPC  10.1.0.0/16</text>
  <rect x="520" y="248" width="140" height="66" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="590" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">2 public subnets</text>
  <text x="590" y="294" text-anchor="middle" font-size="10" fill="#166534">10.1.0/24 · 10.1.1/24</text>
  <rect x="670" y="248" width="140" height="66" rx="6" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="740" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#4338CA">2 private subnets</text>
  <text x="740" y="294" text-anchor="middle" font-size="10" fill="#3730A3">10.1.10/24 · 10.1.11/24</text>
  <text x="665" y="344" text-anchor="middle" font-size="11" fill="#475569">IGW + public routing · 2 AZs</text>

  <!-- state -->
  <rect x="300" y="450" width="300" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="450" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Remote state → S3 (versioned)</text>
  <text x="450" y="497" text-anchor="middle" font-size="11" fill="#92400E">backend "s3" · dapuzzio-iac-tfstate</text>
  <line x1="450" y1="408" x2="450" y2="448" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
